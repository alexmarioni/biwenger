name: Update squads data

on:
  schedule:
    # Tuesdays 09:00 UTC (~06:00 Argentina) — offset a day from the transfers job.
    - cron: '0 9 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch squads from ESPN
        run: node scripts/fetch-squads.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/players.json; then
            echo "No changes, skipping commit."
          else
            git add public/data/players.json
            git commit -m "Update squads data from ESPN"
            git push
          fi
